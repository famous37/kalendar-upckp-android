function saintsArray(s){return String(s||'').split(';').map(tidy).filter(Boolean)}
function num(x){return Number.isFinite(+x)?Math.trunc(+x):0}
function gJdn(y,m,d){let a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function jJdn(y,m,d){let a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-32083}
function jdnToGreg(n){let a=n+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);return [100*b+d-4800+Math.floor(m/10),m+3-12*Math.floor(m/10),e-Math.floor((153*m+2)/5)+1]}
function jdnToJul(n){let c=n+32082,d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);return [d-4800+Math.floor(m/10),m+3-12*Math.floor(m/10),e-Math.floor((153*m+2)/5)+1]}
function pascha(y){let a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),day=(d+e+114)%31+1;return jJdn(y,m,day)}
function relativePascha(jdn){let y=jdnToGreg(jdn)[0],p=pascha(y);if(jdn<p-70)return pascha(y-1);if(jdn>p+300)return pascha(y+1);return p}
function movable(jdn){let n=jdn-relativePascha(jdn);return ({'-70':'Неділя про митаря і фарисея','-63':'Неділя про блудного сина','-56':'Неділя м’ясопусна','-49':'Неділя сиропусна · Прощена неділя','-48':'Початок Великого посту','-8':'Лазарева субота','-7':'Вхід Господній у Єрусалим · Вербна неділя','-3':'Великий четвер','-2':'Велика п’ятниця','-1':'Велика субота','0':'СВІТЛЕ ХРИСТОВЕ ВОСКРЕСІННЯ · ПАСХА','7':'Антипасха · Фомина неділя','24':'Переполовення П’ятидесятниці','39':'ВОЗНЕСІННЯ ГОСПОДНЄ','49':'ДЕНЬ СВЯТОЇ ТРОЙЦІ · П’ЯТИДЕСЯТНИЦЯ','50':'День Святого Духа','56':'Неділя всіх святих'})[n]||(n>=1&&n<=6?'Світлий тиждень':'')}
function fast(jdn){let [cy]=jdnToGreg(jdn),[oy,m,d]=jdnToJul(jdn),p=pascha(cy);if(jdn>=p-48&&jdn<p)return 'Великий піст / Страсний тиждень';if(m===8&&d<=14)return 'Успенський піст';if((m===11&&d>=15)||(m===12&&d<=24))return 'Різдвяний піст';let ap=p+57,end=jJdn(cy,6,28);if(ap<=end&&jdn>=ap&&jdn<=end)return 'Петрів піст';if((m===1&&d===5)||(m===8&&d===29)||(m===9&&d===14))return 'Одноденний піст';if((m===12&&d>=25)||(m===1&&d<=4))return 'Святки · суцільний період';if((jdn>=p-69&&jdn<=p-63)||(jdn>=p&&jdn<=p+6)||(jdn>=p+50&&jdn<=p+56))return 'Суцільний тиждень';if(jdn>=p-55&&jdn<=p-49)return 'Сирний тиждень · без м’яса';let day=((jdn%7)+7)%7;if(day===2||day===4)return 'Середа / п’ятниця · піст за загальним правилом';return 'Пісний період не позначено'}
function entry(jdn){let o=jdnToJul(jdn),record=DATABASE.months[o[1]-1]?.[o[2]-1]||{};return {jdn,old:o,greg:jdnToGreg(jdn),record,feast:tidy(record.feast),saints:saintsArray(record.saints),note:tidy(record.note),moving:movable(jdn),fast:fast(jdn)}}
function fd(a,short=false){return `${a[2]} ${short?MONTHS[a[1]-1].slice(0,3)+'.':MONTHS[a[1]-1]}${short?'':' '+a[0]}`}
function jdnWeek(n){return WEEKDAYS[((n%7)+7)%7]}
function jdnYearToday(){let d=new Date();return gJdn(d.getFullYear(),d.getMonth()+1,d.getDate())}
function encodeDate(arr){return `${String(arr[0]).padStart(4,'0')}-${String(arr[1]).padStart(2,'0')}-${String(arr[2]).padStart(2,'0')}`}
function localDate(jdn){let arr=jdnToGreg(jdn);return encodeDate(arr)}
function holiday(e){return Boolean(e.feast||e.moving)}
function feastArt(e){let [y,m,d]=e.old;if(e.moving.includes('ПАСХА')||e.moving==='Світлий тиждень')return 'voskresenie';if(e.moving.includes('П’ЯТИДЕСЯТНИЦЯ'))return 'pedesetnica';if(m===12&&d===25)return 'rozdestvo';if(m===1&&d===6)return 'bogojavlenie';if(m===2&&d===2)return 'sretenie';if(m===3&&d===25)return 'blagovestenie';if(m===8&&d===6)return 'preobrazenie';if(m===8&&d===15)return 'uspenie';if(m===9&&d===14)return 'vozdvizenie';if(m===11&&d===21)return 'vovedenie';if(m===6&&d===29)return 'apostoli12';if(m===8&&d===29)return 'predteca';return ''}
const NAV=[['day','День'],['month','Місяць'],['search','Пошук'],['saved','Обране']];
function getStore(key,fallback){try{let v=localStorage.getItem('upckp_'+key);return v===null?fallback:JSON.parse(v)}catch{return fallback}}
function putStore(key,value){try{localStorage.setItem('upckp_'+key,JSON.stringify(value))}catch{}}
const state={view:'day',selected:jdnYearToday(),monthView:jdnToGreg(jdnYearToday())[1],yearView:jdnToGreg(jdnYearToday())[0],search:'',limit:50,theme:getStore('theme','auto'),scale:getStore('scale',100),saved:getStore('saved',[])};
function applyTheme(){let selected=state.theme;let dark=selected==='dark'||(selected==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.setProperty('--font-adjust',String(state.scale/100));document.querySelector('#themeBtn').innerHTML=ico(dark?'sun':'moon')}
function navMarkup(view){return NAV.map(([v,name])=>`<button class="tab-btn ${view===v?'active':''}" data-nav="${v}" aria-current="${view===v?'page':'false'}">${ico(v)} <span>${name}</span></button>`).join('')}
function updateNav(){document.querySelector('#desktopNav').innerHTML=navMarkup(state.view);document.querySelector('#mobileNav').innerHTML=navMarkup(state.view)}
function setView(view,scroll=true){state.view=NAV.some(x=>x[0]===view)?view:'day';render();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function setDate(jdn,showDay=true){if(!Number.isInteger(jdn))return;let g=jdnToGreg(jdn);if(g[0]<1800||g[0]>2199)return;state.selected=jdn;state.monthView=g[1];state.yearView=g[0];history.replaceState(null,'',`#date=${encodeDate(g)}`);if(showDay)state.view='day';render();window.scrollTo({top:0,behavior:'smooth'})}
function isSaved(e){return state.saved.includes(`${e.old[1]}-${e.old[2]}`)}
function toggleSaved(){let e=entry(state.selected),key=`${e.old[1]}-${e.old[2]}`;state.saved=isSaved(e)?state.saved.filter(x=>x!==key):[...state.saved,key];putStore('saved',state.saved);render();notify(isSaved(e)?'Додано до обраного':'Вилучено з обраного')}
function lookupUpcoming(from,count,maxDays=95){let list=[];for(let i=1;i<=maxDays&&list.length<count;i++){let v=entry(from+i),name=v.moving||v.feast;if(name&&v.moving!=='Світлий тиждень')list.push({v,name});}return list}
function hero(e){let art=feastArt(e);return `<section class="hero" aria-label="Обрана дата"><div class="hero-copy"><div class="hero-date-label"><span style="font-size:16px">✥</span> ${esc(jdnWeek(e.jdn))} · старий стиль</div><div class="hero-old">${e.old[2]} ${esc(MONTHS[e.old[1]-1])}</div><div class="hero-civil"><span class="civil-pill">${esc(fd(e.greg))}</span><span>новий стиль</span></div><div class="hero-note">${ico('info')}<span>${esc(e.fast)}</span></div></div><div class="hero-art ${art?'':'default-art'}" aria-hidden="true">${art?`<img src="${ART[art]}" alt="">`:'<span>☦</span>'}</div></section>`}
function showDay(){let e=entry(state.selected);let saints=e.saints.filter(x=>!(e.feast&&x.toLowerCase()===e.feast.toLowerCase()));let hasFeasts=e.moving||e.feast;return `${hero(e)}
<div class="day-switch"><button class="nav-arrow" data-go="prev">${ico('arrowLeft')} <span>Назад</span></button><div class="day-switch-center"><button class="date-button" data-action="pick">${esc(fd(e.greg))}</button> · <button class="date-button" data-action="today">сьогодні</button></div><button class="nav-arrow" data-go="next"><span>Далі</span> ${ico('arrowRight')}</button></div>
<article class="card memories"><div class="memories-head"><div><div class="eyebrow">Церковні пам’яті</div><h2 class="section-title">Пам’ять дня</h2></div><button class="icon-btn bookmark-btn ${isSaved(e)?'saved':''}" data-action="bookmark" title="${isSaved(e)?'Вилучити з обраного':'Додати до обраного'}" aria-label="${isSaved(e)?'Вилучити з обраного':'Додати до обраного'}">${ico('saved')}</button></div>
${e.moving?`<section class="special-feast"><div class="eyebrow">Рухоме свято</div><h3>${esc(e.moving)}</h3></section>`:''}
${e.feast?`<section class="special-feast"><div class="eyebrow">Свято дня</div><h3>${esc(e.feast)}</h3></section>`:''}
${e.note?`<div class="note-strip">${ico('info')}<span>${esc(e.note)}</span></div>`:''}
${saints.length?`<div class="divider"></div><div class="eyebrow">Святі та події</div><ul class="saint-list">${saints.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:!hasFeasts?'<p class="muted">Немає окремих текстових записів для цього дня.</p>':''}
<div class="card-actions"><button class="plain-btn" data-action="copy">${ico('copy')} Копіювати</button><button class="plain-btn" data-action="share">${ico('share')} Поділитися</button><button class="plain-btn" data-action="print">${ico('print')} Друк</button></div></article>`}
function monthCalendar(year,month,large=false){let first=gJdn(year,month,1),offset=((first%7)+7)%7,days=(offset+new Date(year,month,0).getDate()+6);days=Math.ceil(days/7)*7;let html=WEEKSHORT.map(t=>`<span class="week-label">${t}</span>`).join('');for(let i=0;i<days;i++){let j=first-offset+i,e=entry(j),current=e.greg[1]===month,today=j===jdnYearToday(),selected=j===state.selected,event=holiday(e);if(large){let label=e.moving||e.feast;html+=`<button class="calendar-cell ${current?'':'outside'} ${today?'today':''} ${selected?'selected':''}" data-date="${j}" aria-label="${esc(fd(e.greg))}, за старим стилем ${esc(fd(e.old))}${label?', '+esc(label):''}"><span class="cell-civil">${e.greg[2]}</span><span class="cell-old">${e.old[2]} ${esc(MONTHS[e.old[1]-1].slice(0,3))}.</span>${label?`<span class="cell-event">${esc(label)}</span>`:''}</button>`}else{html+=`<button class="mini-day ${current?'':'outside'} ${today?'today':''} ${selected?'selected':''} ${event?'event':''}" data-date="${j}" aria-label="${esc(fd(e.greg))}">${e.greg[2]}</button>`}}return html}
function shiftMonth(delta){let y=state.yearView,m=state.monthView+delta;if(m<1){m=12;y--}if(m>12){m=1;y++}if(y<1800||y>2199)return;state.yearView=y;state.monthView=m;render()}
function sideBar(){let y=state.yearView,m=state.monthView;let items=lookupUpcoming(jdnYearToday(),5,90);return `<div class="card card-pad"><div class="side-head"><h2 class="side-title">${esc(MONTHS_NOM[m-1])} ${y}</h2><div class="month-controls"><button class="tiny-btn" data-action="monthPrev" title="Попередній місяць" aria-label="Попередній місяць">${ico('arrowLeft')}</button><button class="tiny-btn" data-action="monthNext" title="Наступний місяць" aria-label="Наступний місяць">${ico('arrowRight')}</button></div></div><div class="mini-grid">${monthCalendar(y,m)}</div><p class="side-caption">Числа — за новим стилем. • Позначено святкові дати. Торкніться числа, щоб відкрити день.</p><button class="plain-btn" data-nav="month" style="width:100%;margin-top:9px">${ico('month')} Весь місяць</button></div>
<div class="card card-pad"><div class="eyebrow" style="margin-bottom:10px">Церковний рік</div><h2 class="side-title">Найближчі свята</h2><div class="upcoming-list">${items.map(({v,name})=>`<button class="upcoming-item" data-date="${v.jdn}"><span class="event-date"><strong>${v.greg[2]}</strong><small>${esc(MONTHS[v.greg[1]-1].slice(0,3).toUpperCase())}</small></span><span><strong class="event-title">${esc(name)}</strong><small class="event-meta">${esc(fd(v.old))} · ст. стиль</small></span></button>`).join('')}</div></div>
`}
function showMonth(){let m=state.monthView,y=state.yearView;return `<div class="eyebrow">Перегляд календаря</div><h1 class="page-title">Календар на місяць</h1><p class="page-subtitle">Велике число — новий стиль, мале — старий.</p><div class="card big-calendar"><div class="month-page-head"><div class="month-label">${esc(MONTHS_NOM[m-1])} ${y}</div><div class="month-toolbar"><button class="tiny-btn" data-action="monthPrev" aria-label="Попередній місяць">${ico('arrowLeft')}</button><button class="plain-btn" data-action="currentMonth" style="height:34px;font-size:12px">Цей місяць</button><button class="tiny-btn" data-action="monthNext" aria-label="Наступний місяць">${ico('arrowRight')}</button></div></div><div class="big-grid" style="margin-top:13px">${monthCalendar(y,m,true)}</div><div class="big-cal-caption"><span class="legend"><span class="legend-dot"></span> Свята та рухомі дні</span><span class="legend">Обведена дата — вибраний день</span></div></div>`}
function searchRecords(query){let q=query.trim().toLocaleLowerCase('uk');if(!q)return [];let arr=[];for(let m=1;m<=12;m++)for(let d=1;d<=DATABASE.months[m-1].length;d++){let v=DATABASE.months[m-1][d-1],hay=[v.saints,v.feast,v.note].join(' ').toLocaleLowerCase('uk');if(hay.includes(q))arr.push({m,d,data:v})}return arr}
function oldToTarget(m,d){let year=jdnToJul(state.selected)[0],target=jJdn(year,m,d);if(m===2&&d===29&&year%4!==0)target=jJdn(year+((4-year%4)%4),m,d);return target}
function searchList(records){return records.slice(0,state.limit).map(h=>{let day=oldToTarget(h.m,h.d),raw=tidy(h.data.feast)||saintsArray(h.data.saints)[0]||'',extra=saintsArray(h.data.saints).slice(0,3).join('; ');return `<button class="result-item" data-date="${day}"><span class="result-date">${h.d} ${esc(MONTHS[h.m-1].slice(0,3))}.</span><span class="result-main"><strong>${esc(raw)}</strong><small>${esc(extra)}</small></span>${ico('arrowRight')}</button>`}).join('')}
function showSearch(){let found=searchRecords(state.search);return `<div class="eyebrow">За календарною базою</div><h1 class="page-title">Пошук святих і свят</h1><p class="page-subtitle">Шукайте за ім’ям святого, назвою свята, церковною подією або ключовим словом. </p><label class="searchbox">${ico('search')}<input id="searchInput" type="search" autocomplete="off" value="${esc(state.search)}" placeholder="Наприклад: Миколая, Покрова, Василія…" aria-label="Пошук за календарем"></label>${state.search.trim()?`<div class="result-count">${found.length?`Знайдено: ${found.length}`:'Нічого не знайдено'}</div>${found.length?searchList(found):'<div class="card no-content"><span class="empty-symbol">⌕</span>Спробуйте інше ім’я або назву свята.</div>'}${found.length>state.limit?`<button class="plain-btn load-more" data-action="more">Показати ще ${Math.min(50,found.length-state.limit)} результатів ${ico('arrowRight')}</button>`:''}`:'<div class="card no-content" style="margin-top:18px"><span class="empty-symbol">☦</span>Введіть слово, щоб знайти пам’ять святого або свято.</div>'}`}
function showSaved(){let saved=state.saved.map(k=>{let [m,d]=k.split('-').map(Number);if(!m||!d||m>12||d>DATABASE.months[m-1].length)return null;let j=oldToTarget(m,d),e=entry(j);return {m,d,j,e}}).filter(Boolean).sort((a,b)=>a.m-b.m||a.d-b.d);return `<div class="eyebrow">Збережені пам’яті</div><h1 class="page-title">Обрані дати</h1><p class="page-subtitle">Позначайте важливі для вас дні.</p>${saved.length?saved.map(({m,d,j,e})=>`<button class="fav-item" data-date="${j}"><span class="result-date">${d} ${esc(MONTHS[m-1].slice(0,3))}.</span><span class="result-main"><strong>${esc(e.feast||e.saints[0]||'Пам’ять дня')}</strong><small>${esc(fd(e.greg))} · за новим стилем</small></span>${ico('arrowRight')}</button>`).join(''):'<div class="card no-content"><span class="empty-symbol">☆</span>Ще немає обраних дат. Відкрийте потрібний день і натисніть закладку.</div>'}`}
function render(){updateNav();let main=state.view==='day'?showDay():state.view==='month'?showMonth():state.view==='search'?showSearch():showSaved();document.querySelector('#mainContent').innerHTML=main;document.querySelector('#sidebar').innerHTML=sideBar();applyTheme()}
function dayText(){let e=entry(state.selected);return `Церковний календар УПЦ КП\n${jdnWeek(e.jdn)}, ${fd(e.greg)} (новий стиль)\n${fd(e.old)} (старий стиль)\n${e.moving?'\n'+e.moving:''}${e.feast?'\n'+e.feast:''}${e.note?'\n'+e.note:''}\n\n${e.saints.map(x=>'• '+x).join('\n')}\n\nПіст: ${e.fast}`}
function notify(msg){let t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),2600)}
async function copyDay(){let txt=dayText();try{await navigator.clipboard.writeText(txt);notify('Текст дня скопійовано')}catch{let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();notify(ok?'Текст дня скопійовано':'Копіювання недоступне в цьому браузері')}}
async function shareDay(){let d=entry(state.selected),text=dayText();if(navigator.share){try{await navigator.share({title:`Церковний календар · ${fd(d.greg)}`,text});return}catch(e){if(e.name==='AbortError')return}}await copyDay()}
function closeDialog(){document.querySelector('#overlay').classList.remove('open');document.querySelector('#dialog').innerHTML=''}
function openDialog(content){document.querySelector('#dialog').innerHTML=content;document.querySelector('#overlay').classList.add('open');document.querySelector('#dialog').querySelector('[data-action="close"]')?.focus()}
function settings(){openDialog(`<div class="dialog-header"><h2 class="section-title" id="modalTitle">Налаштування</h2><button class="icon-btn" data-action="close" aria-label="Закрити">${ico('close')}</button></div><div class="form-field"><label for="themeSelect">Оформлення</label><select id="themeSelect" class="field-input"><option value="auto" ${state.theme==='auto'?'selected':''}>Як у системі</option><option value="light" ${state.theme==='light'?'selected':''}>Світла тема</option><option value="dark" ${state.theme==='dark'?'selected':''}>Темна тема</option></select></div><div class="form-field"><label for="fontRange">Розмір тексту · <span id="fontValue">${state.scale}%</span></label><div class="field-row"><span>Аа</span><input type="range" id="fontRange" min="85" max="135" step="5" value="${state.scale}"><strong>Аа</strong></div></div><button class="plain-btn button-gold" data-action="close">Готово</button>`)}
function pickDate(){openDialog(`<div class="dialog-header"><h2 class="section-title" id="modalTitle">Перейти до дати</h2><button class="icon-btn" data-action="close" aria-label="Закрити">${ico('close')}</button></div><p class="muted">Оберіть цивільну дату (за новим стилем).</p><div class="form-field"><label for="dateInput">Дата</label><input class="field-input" type="date" id="dateInput" min="1800-01-01" max="2199-12-31" value="${localDate(state.selected)}"></div><button class="plain-btn button-gold" data-action="applyDate">Відкрити день</button>`)}
function parseHash(){let s=location.hash.replace(/^#/,'');let match=s.match(/(?:^|&)date=(\d{4})-(\d{2})-(\d{2})/);if(match){let y=+match[1],m=+match[2],d=+match[3];if(y>=1800&&y<=2199&&m>=1&&m<=12&&d>=1&&d<=new Date(y,m,0).getDate()){state.selected=gJdn(y,m,d);state.yearView=y;state.monthView=m}}}
function init(){parseHash();render();document.querySelector('#logo').addEventListener('click',e=>{e.preventDefault();setView('day')});document.querySelector('#todayHeader').addEventListener('click',()=>setDate(jdnYearToday()));document.querySelector('#themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';putStore('theme',state.theme);applyTheme()});document.querySelector('#settingsBtn').addEventListener('click',settings);
document.addEventListener('click',async e=>{let b=e.target.closest('[data-nav],[data-go],[data-date],[data-action]');if(!b)return;if(b.dataset.nav){setView(b.dataset.nav);return}if(b.dataset.date){setDate(Number(b.dataset.date));return}if(b.dataset.go){setDate(state.selected+(b.dataset.go==='next'?1:-1));return}let act=b.dataset.action;if(act==='bookmark')toggleSaved();else if(act==='today')setDate(jdnYearToday());else if(act==='monthPrev')shiftMonth(-1);else if(act==='monthNext')shiftMonth(1);else if(act==='currentMonth'){let t=jdnToGreg(jdnYearToday());state.yearView=t[0];state.monthView=t[1];render()}else if(act==='pick')pickDate();else if(act==='close')closeDialog();else if(act==='applyDate'){let raw=document.querySelector('#dateInput')?.value||'',m=raw.match(/^(\d{4})-(\d\d)-(\d\d)$/);if(m){let y=+m[1],mo=+m[2],d=+m[3];if(y>=1800&&y<=2199&&d>=1&&d<=new Date(y,mo,0).getDate()){closeDialog();setDate(gJdn(y,mo,d));return}}notify('Оберіть правильну дату')}else if(act==='copy')await copyDay();else if(act==='share')await shareDay();else if(act==='print')window.print();else if(act==='more'){state.limit+=50;let pos=window.scrollY;render();window.scrollTo(0,pos)}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){let pos=e.target.selectionStart;state.search=e.target.value;state.limit=50;let result=searchRecords(state.search);let div=document.createElement('div');div.innerHTML=result.length?searchList(result):'<div class="card no-content">Нічого не знайдено.</div>';let wrapper=e.target.closest('.searchbox');let nodes=Array.from(wrapper.parentElement.children);nodes.slice(nodes.indexOf(wrapper)+1).forEach(n=>n.remove());let anchor=document.createElement('div');anchor.innerHTML=`<div class="result-count">${result.length?`Знайдено: ${result.length}`:'Нічого не знайдено'}</div>`+div.innerHTML+(result.length>state.limit?`<button class="plain-btn load-more" data-action="more">Показати ще ${Math.min(50,result.length-state.limit)} результатів</button>`:'');wrapper.after(...Array.from(anchor.children));e.target.setSelectionRange(pos,pos)}else if(e.target.id==='fontRange'){state.scale=+e.target.value;document.querySelector('#fontValue').textContent=state.scale+'%';putStore('scale',state.scale);applyTheme()}});
document.addEventListener('change',e=>{if(e.target.id==='themeSelect'){state.theme=e.target.value;putStore('theme',state.theme);applyTheme()}});document.querySelector('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDialog()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(!document.querySelector('#overlay').classList.contains('open')&&state.view==='day'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){if(e.key==='ArrowLeft')setDate(state.selected-1);if(e.key==='ArrowRight')setDate(state.selected+1)}});window.addEventListener('hashchange',()=>{parseHash();state.view='day';render()});if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.theme==='auto')applyTheme()});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).then(reg => {
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) reg.update().catch(()=>{});
    });
  }).catch(()=>{});
}
}
init();
</script>
</body>
</html>

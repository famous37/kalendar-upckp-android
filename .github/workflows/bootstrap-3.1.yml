name: Bootstrap Android 3.1 sources
on:
  push:
    branches: [feature/calendar-3.1]
    paths: ['.github/workflows/bootstrap-3.1.yml']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand original Android project into reviewable source files
        run: |
          set -euo pipefail
          mkdir -p /tmp/kalendar-source
          unzip -q Kalendar_UPCKP_3.0_Source_2026-11-08.zip -d /tmp/kalendar-source
          test -f /tmp/kalendar-source/app/build.gradle
          cp -R /tmp/kalendar-source/app ./
          cp /tmp/kalendar-source/build.gradle /tmp/kalendar-source/settings.gradle /tmp/kalendar-source/gradle.properties ./
          cp /tmp/kalendar-source/VALIDATION.md ./VALIDATION.md
          git add app build.gradle settings.gradle gradle.properties VALIDATION.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: expose original Android sources for v3.1 development"
          git push origin HEAD:feature/calendar-3.1

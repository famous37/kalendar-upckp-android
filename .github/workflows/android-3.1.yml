name: Android 3.1 CI / APK
on:
  push:
    branches: [feature/calendar-3.1, main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-3.1.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests, instrumentation APK, and debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify build artifact
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalendar-UPCKP-3.1-rc1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalendar-UPCKP-3.1-rc1-ui-tests
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  emulator-ui:
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run navigation UI tests on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p screenshots
            adb pull /sdcard/Pictures/KalendarThemeQA/. screenshots/
      - name: Upload light and dark UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Kalendar-3.1-visual-theme-check
          path: screenshots/*.png
          if-no-files-found: warn

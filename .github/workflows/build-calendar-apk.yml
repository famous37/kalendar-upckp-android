name: Build Calendar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Kalendar_UPCKP_3.0_Source_REUPLOAD.zip'
      - '.github/workflows/build-calendar-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f Kalendar_UPCKP_3.0_Source_REUPLOAD.zip || { echo "::error::Upload Kalendar_UPCKP_3.0_Source_REUPLOAD.zip to the repository root first."; exit 1; }
          mkdir -p project
          unzip -q Kalendar_UPCKP_3.0_Source_REUPLOAD.zip -d project
          test -f project/app/build.gradle || { echo "::error::Android project not found in ZIP root"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          unzip -t project/app/build/outputs/apk/debug/app-debug.apk | tail -n 1

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: UPCKP-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
